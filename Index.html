<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Corazón</title>

<style>
body {
  background: black;
  color: #ff4d6d;
  font-family: monospace;
  white-space: pre;
  font-size: 14px;
}
</style>
</head>

<body>

<pre id="heart"></pre>

<script>
const text = "Reyna te quiero mucho"; // ← cambia el nombre aquí
let output = "";
let i = 0;

let points = [];

// Generar forma del corazón
for (let y = 1.5; y > -1.5; y -= 0.1) {
  let line = "";
  for (let x = -1.5; x < 1.5; x += 0.05) {
    let formula =
      Math.pow(x*x + y*y - 1, 3) - x*x*y*y*y;

    if (formula <= 0) {
      line += text[(i++) % text.length];
    } else {
      line += " ";
    }
  }
  points.push(line);
}

// Animación tipo escritura
let currentLine = 0;
let heart = document.getElementById("heart");

function draw() {
  if (currentLine < points.length) {
    output += points[currentLine] + "\n";
    heart.textContent = output;
    currentLine++;
    setTimeout(draw, 60);
  }
}

draw();
</script>

</body>
</html>
