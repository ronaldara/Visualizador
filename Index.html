<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>NIVEL DIOS Visualizer</title>

<style>
body{
margin:0;
background:black;
overflow:hidden;
}
.controls{
position:fixed;
top:10px;
left:10px;
z-index:10;
}
button,input{
padding:8px;
margin:4px;
border:none;
cursor:pointer;
}
</style>
</head>

<body>

<div class="controls">
<input type="file" id="file">
<button id="mic">Mic</button>
<button onclick="toggleFullscreen()">Fullscreen</button>
</div>

<canvas id="c"></canvas>

<script>
const canvas=c;
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=innerWidth;
canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
const analyser=audioCtx.createAnalyser();
analyser.fftSize=1024;

let data=new Uint8Array(analyser.frequencyBinCount);
let source;

function connect(src){
if(source) source.disconnect();
source=src;
source.connect(analyser);
analyser.connect(audioCtx.destination);
}

file.onchange=e=>{
let audio=new Audio(URL.createObjectURL(e.target.files[0]));
audio.loop=true;
connect(audioCtx.createMediaElementSource(audio));
audio.play();
};

mic.onclick=async()=>{
let stream=await navigator.mediaDevices.getUserMedia({audio:true});
connect(audioCtx.createMediaStreamSource(stream));
};

class Star{
constructor(){
this.reset();
}
reset(){
this.x=(Math.random()-0.5)*canvas.width;
this.y=(Math.random()-0.5)*canvas.height;
this.z=Math.random()*canvas.width;
}
update(speed){
this.z-=speed;
if(this.z<=1) this.reset();
}
draw(){
let sx=(this.x/this.z)*canvas.width/2+canvas.width/2;
let sy=(this.y/this.z)*canvas.height/2+canvas.height/2;
let size=(1-this.z/canvas.width)*3;
ctx.fillRect(sx,sy,size,size);
}
}

let stars=Array.from({length:300},()=>new Star());

class Burst{
constructor(power){
this.angle=Math.random()*Math.PI*2;
this.radius=0;
this.speed=power/30;
this.life=60;
}
update(){
this.radius+=this.speed;
this.life--;
}
draw(cx,cy,hue){
let x=cx+Math.cos(this.angle)*this.radius;
let y=cy+Math.sin(this.angle)*this.radius;
ctx.fillStyle=`hsl(${hue},100%,60%)`;
ctx.beginPath();
ctx.arc(x,y,2,0,Math.PI*2);
ctx.fill();
}
}

let bursts=[];
let hue=0;
let beatCooldown=0;

function beat(avg){
if(avg>180 && beatCooldown<=0){
for(let i=0;i<120;i++) bursts.push(new Burst(avg));
beatCooldown=20;
}
beatCooldown--;
}

function starfield(avg){
ctx.fillStyle="white";
stars.forEach(s=>{
s.update(avg/40);
s.draw();
});
}

function fractalTunnel(avg){
let cx=canvas.width/2;
let cy=canvas.height/2;

for(let i=0;i<25;i++){
let r=(i*30)+(avg);
ctx.strokeStyle=`hsla(${hue+i*8},100%,50%,0.4)`;
ctx.beginPath();
ctx.arc(cx,cy,r,0,Math.PI*2);
ctx.stroke();
}
}

function orbit(avg){
let cx=canvas.width/2;
let cy=canvas.height/2;

ctx.beginPath();
for(let i=0;i<data.length;i++){
let a=i/data.length*Math.PI*2;
let r=180+data[i];
let x=cx+Math.cos(a)*r;
let y=cy+Math.sin(a)*r;
ctx.lineTo(x,y);
}
ctx.closePath();
ctx.strokeStyle=`hsl(${hue},100%,60%)`;
ctx.lineWidth=3;
ctx.stroke();
}

function distortion(avg){
ctx.save();
ctx.globalCompositeOperation="lighter";
ctx.fillStyle=`hsla(${hue},100%,50%,0.05)`;
ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.restore();
}

function updateBursts(){
bursts=bursts.filter(b=>b.life>0);
bursts.forEach(b=>{
b.update();
b.draw(canvas.width/2,canvas.height/2,hue);
});
}

function trail(){
ctx.fillStyle="rgba(0,0,0,0.12)";
ctx.fillRect(0,0,canvas.width,canvas.height);
}

function animate(){
requestAnimationFrame(animate);

analyser.getByteFrequencyData(data);

let avg=data.reduce((a,b)=>a+b)/data.length;

trail();

hue+=avg/40;

beat(avg);
distortion(avg);
starfield(avg);
fractalTunnel(avg);
orbit(avg);
updateBursts();
}

animate();

function toggleFullscreen(){
if(!document.fullscreenElement)
document.documentElement.requestFullscreen();
else document.exitFullscreen();
}
</script>

</body>
</html>
